<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background-color: #f4f4f4;
    color: #333;
    line-height: 1.6;
}

/* Header style */
header {
    background: #333;
    color: #fff;
    display: flex;
    justify-content: space-between;
    padding: 20px 50px;
    position: fixed;
    width: 100%;
    top: 0;
}

header nav a {
    color: #fff;
    text-decoration: none;
    margin-left: 20px;
    transition: 0.3s;
}

header nav a:hover {
    color: #00bcd4;
}

/* Sections style */
.section {
    padding: 100px 20px 50px;
    text-align: center;
    min-height: 100vh;
}

#about {
    background: #e3f2fd;
}

.skills-box span {
    background: #fff;
    padding: 10px 20px;
    margin: 5px;
    display: inline-block;
    border-radius: 5px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.project-card {
    background: #fff;
    padding: 20px;
    max-width: 300px;
    margin: 20px auto;
    border-radius: 5px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    transition: 0.3s;
}
.contact-card {
    background: #fff;
    padding: 20px;
    max-width: 300px;
    margin: 20px auto;
    border-radius: 5px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    transition: 0.3s;
}

/* Hover effect */
.project-card:hover {
    transform: translateY(-5px);
}
</style>
</head>
<body>

    <!-- Header & Navigation Bar -->
    <header>
        <h2>MyPortfolio</h2>
        <nav>
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- About Section -->
    <section id="about" class="section">
        <h1>Hello, I'm lellu</h1>
        <p>I am a beginner web developer learning how to build clean websites.</p>
    </section>

    <!-- Skills Section -->
    <section id="skills" class="section">
        <h2>My Skills</h2>
        <div class="skills-box">
            <span>HTML</span>
            <span>CSS</span>
            <span>JavaScript</span>
        </div>
    </section>

    <!-- Projects Section -->
    <section id="projects" class="section">
        <h2>My Projects</h2>
        <div class="project-card">
            <h3>Project </h3>
            <p>A simple website built using HTML and CSS.</p>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="section">
        <h2>Contact Me</h2>
		<div class="contact-card">
        <p>Email: lellu003@gmail.com</p>
		<p>Phone: +255(0)-679005596</p>
		</div>
    </section>

</body>
</html>
